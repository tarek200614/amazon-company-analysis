<svg width="820" height="760" viewBox="0 0 820 760" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="820" height="760" fill="#FFFFFF"/>

  <text x="410" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#131A22">
    Amazon's Growth Flywheel
  </text>
  <text x="410" y="68" text-anchor="middle" font-size="13.5" fill="#565959">
    Original analysis — how low cost structure, AI, and AWS reinforce Amazon's core retail loop
  </text>

  <!-- central circle -->
  <circle cx="410" cy="415" r="118" fill="#131A22"/>
  <text x="410" y="405" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">Customer</text>
  <text x="410" y="428" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">Experience</text>
  <text x="410" y="450" text-anchor="middle" font-size="11.5" fill="#FF9900">Earth's most customer-centric company</text>

  <!-- 6 nodes around the circle -->
  <!-- node positions: angle from top, clockwise -->
  <!-- 1: Lower Prices (top) -->
  <g>
    <circle cx="410" cy="150" r="72" fill="#FFFFFF" stroke="#FF9900" stroke-width="3"/>
    <text x="410" y="145" text-anchor="middle" font-size="14.5" font-weight="700" fill="#131A22">Lower Prices</text>
    <text x="410" y="164" text-anchor="middle" font-size="10.5" fill="#565959">Cost efficiency passed</text>
    <text x="410" y="178" text-anchor="middle" font-size="10.5" fill="#565959">on to shoppers</text>
  </g>

  <!-- 2: More Traffic (top right) -->
  <g>
    <circle cx="660" cy="255" r="72" fill="#FFFFFF" stroke="#FF9900" stroke-width="3"/>
    <text x="660" y="250" text-anchor="middle" font-size="14.5" font-weight="700" fill="#131A22">More Traffic</text>
    <text x="660" y="269" text-anchor="middle" font-size="10.5" fill="#565959">300M+ users on AI</text>
    <text x="660" y="283" text-anchor="middle" font-size="10.5" fill="#565959">shopping tools</text>
  </g>

  <!-- 3: More Sellers (bottom right) -->
  <g>
    <circle cx="660" cy="540" r="72" fill="#FFFFFF" stroke="#FF9900" stroke-width="3"/>
    <text x="660" y="535" text-anchor="middle" font-size="14.5" font-weight="700" fill="#131A22">More Sellers</text>
    <text x="660" y="554" text-anchor="middle" font-size="10.5" fill="#565959">~60% of physical GMS</text>
    <text x="660" y="568" text-anchor="middle" font-size="10.5" fill="#565959">from 3P marketplace</text>
  </g>

  <!-- 4: Greater Selection (bottom) -->
  <g>
    <circle cx="410" cy="655" r="72" fill="#FFFFFF" stroke="#FF9900" stroke-width="3"/>
    <text x="410" y="650" text-anchor="middle" font-size="14.5" font-weight="700" fill="#131A22">Greater Selection</text>
    <text x="410" y="669" text-anchor="middle" font-size="10.5" fill="#565959">Broadest catalog,</text>
    <text x="410" y="683" text-anchor="middle" font-size="10.5" fill="#565959">fastest fulfillment</text>
  </g>

  <!-- 5: Logistics & Automation (bottom left) -->
  <g>
    <circle cx="160" cy="540" r="72" fill="#FFFFFF" stroke="#FF9900" stroke-width="3"/>
    <text x="160" y="530" text-anchor="middle" font-size="14.5" font-weight="700" fill="#131A22">Logistics &amp;</text>
    <text x="160" y="548" text-anchor="middle" font-size="14.5" font-weight="700" fill="#131A22">Automation</text>
    <text x="160" y="567" text-anchor="middle" font-size="10.5" fill="#565959">750K+ robots, ~75%</text>
    <text x="160" y="581" text-anchor="middle" font-size="10.5" fill="#565959">of orders assisted</text>
  </g>

  <!-- 6: AWS + AI Profit Engine (top left) -->
  <g>
    <circle cx="160" cy="255" r="72" fill="#FFFFFF" stroke="#FF9900" stroke-width="3"/>
    <text x="160" y="245" text-anchor="middle" font-size="14.5" font-weight="700" fill="#131A22">AWS + AI</text>
    <text x="160" y="263" text-anchor="middle" font-size="14.5" font-weight="700" fill="#131A22">Profit Engine</text>
    <text x="160" y="282" text-anchor="middle" font-size="10.5" fill="#565959">~57% of operating income</text>
  </g>

  <!-- connecting arrows around the loop -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#131A22"/>
    </marker>
  </defs>

  <path d="M 470 175 A 260 260 0 0 1 610 210" fill="none" stroke="#131A22" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 700 320 A 260 260 0 0 1 700 480" fill="none" stroke="#131A22" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 615 600 A 260 260 0 0 1 475 645" fill="none" stroke="#131A22" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 350 645 A 260 260 0 0 1 210 600" fill="none" stroke="#131A22" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 120 480 A 260 260 0 0 1 120 320" fill="none" stroke="#131A22" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 210 210 A 260 260 0 0 1 350 175" fill="none" stroke="#131A22" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="410" y="735" text-anchor="middle" font-size="10.5" fill="#565959" font-style="italic">
    Original diagram synthesized from Amazon's disclosed business-model, logistics, and AI-strategy data (FY2025).
  </text>
</svg>
